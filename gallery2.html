    <script>
      (function() {
        var thumbs = Array.prototype.slice.call(document.querySelectorAll('.gallery2-thumb img'));
        var overlay = document.getElementById('gallery2Carousel');
        var image = document.getElementById('gallery2CarouselImage');
        var caption = document.getElementById('gallery2CarouselCaption');
        var closeButton = document.querySelector('.gallery2-carousel-close');
        var prevButton = document.querySelector('.gallery2-carousel-prev');
        var nextButton = document.querySelector('.gallery2-carousel-next');
        var currentIndex = 0;

        function showImage(index) {
          currentIndex = (index + thumbs.length) % thumbs.length;
          image.src = thumbs[currentIndex].getAttribute('src');
          image.alt = thumbs[currentIndex].getAttribute('alt');
          caption.textContent = thumbs[currentIndex].getAttribute('alt');
        }

        function openCarousel(index) {
          showImage(index);
          overlay.classList.add('is-open');
          overlay.setAttribute('aria-hidden', 'false');
          document.body.classList.add('gallery2-carousel-open');
          closeButton.focus();
        }

        function closeCarousel() {
          overlay.classList.remove('is-open');
          overlay.setAttribute('aria-hidden', 'true');
          document.body.classList.remove('gallery2-carousel-open');
        }

        document.querySelectorAll('.gallery2-thumb').forEach(function(button) {
          button.addEventListener('click', function() {
            openCarousel(parseInt(button.getAttribute('data-carousel-index'), 10));
          });
        });

        closeButton.addEventListener('click', closeCarousel);
        prevButton.addEventListener('click', function() { showImage(currentIndex - 1); });
        nextButton.addEventListener('click', function() { showImage(currentIndex + 1); });
        overlay.addEventListener('click', function(event) {
          if (event.target === overlay) {
            closeCarousel();
          }
        });

        document.addEventListener('keydown', function(event) {
          if (!overlay.classList.contains('is-open')) {
            return;
          }
          if (event.key === 'Escape') {
            closeCarousel();
          }
          if (event.key === 'ArrowLeft') {
            showImage(currentIndex - 1);
          }
          if (event.key === 'ArrowRight') {
            showImage(currentIndex + 1);
          }
        });
      })();
    </script>
